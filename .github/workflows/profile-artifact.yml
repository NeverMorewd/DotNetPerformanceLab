name: Profile application artifact

on:
  workflow_call:
    inputs:
      platform:
        description: "Performance runner OS label: Windows, Linux, or macOS."
        required: true
        type: string
      artifact-name:
        description: Exact name of the application artifact uploaded earlier in the caller workflow run.
        required: true
        type: string
      executable-path:
        description: Executable path relative to the downloaded artifact root.
        required: true
        type: string
      working-directory:
        description: Working directory relative to the artifact root. Empty uses the artifact root.
        required: false
        default: ''
        type: string
      arguments-json:
        required: false
        default: '[]'
        type: string
      report-label:
        required: false
        default: .NET application artifact
        type: string
      warmup-seconds:
        required: false
        default: 60
        type: number
      measurement-seconds:
        required: false
        default: 300
        type: number
      sample-interval-ms:
        required: false
        default: 1000
        type: number
      cooldown-seconds:
        required: false
        default: 10
        type: number
      iterations:
        required: false
        default: 3
        type: number
      collect-counters:
        required: false
        default: true
        type: boolean
      counter-duration-seconds:
        required: false
        default: 30
        type: number
      meters-json:
        description: Additional System.Diagnostics.Metrics meter names as a JSON string array.
        required: false
        default: '[]'
        type: string
      live-endpoint:
        description: Optional HTTPS base URL implementing the DotNetPerformanceLab live ingestion protocol.
        required: false
        default: ''
        type: string
      collect-trace:
        required: false
        default: false
        type: boolean
      trace-duration-seconds:
        required: false
        default: 30
        type: number
      fail-on-target-exit:
        required: false
        default: true
        type: boolean
      artifact-retention-days:
        required: false
        default: 14
        type: number
      interactive-report-url:
        description: Optional HTTPS URL shown as the interactive dashboard link in the job summary.
        required: false
        default: ''
        type: string
      toolkit-ref:
        required: false
        default: v2
        type: string
      use-github-hosted-validation-runner:
        description: Use an isolated Windows runner for toolkit self-tests. Keep false for application profiling.
        required: false
        default: false
        type: boolean
    secrets:
      live-token:
        description: Bearer token for the optional live ingestion endpoint.
        required: false

permissions:
  contents: read
  actions: read

jobs:
  profile:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    name: Profile ${{ inputs.report-label }}
    runs-on: ${{ inputs.use-github-hosted-validation-runner && 'windows-latest' || fromJSON(format('["self-hosted","metric-test","{0}"]', inputs.platform)) }}
    environment: ${{ inputs.use-github-hosted-validation-runner && 'toolkit-validation' || 'performance-lab' }}
    timeout-minutes: 150

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/dotnet-performance-target-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Checkout performance toolkit
        uses: actions/checkout@v7
        with:
          repository: NeverMorewd/DotNetPerformanceLab
          ref: ${{ inputs.toolkit-ref }}
          path: .dotnet-performance-lab
          persist-credentials: false

      - name: Restore executable permission
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          DPL_DOWNLOADED_EXECUTABLE: ${{ runner.temp }}/dotnet-performance-target-${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.executable-path }}
        run: chmod u+x -- "$DPL_DOWNLOADED_EXECUTABLE"

      - name: Set up diagnostic runtimes
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.302

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore locked web dependencies
        working-directory: .dotnet-performance-lab
        run: npm ci --prefix web --ignore-scripts

      - name: Restore locked toolkit dependencies
        working-directory: .dotnet-performance-lab
        run: dotnet restore DotNetPerformanceLab.slnx --locked-mode

      - name: Restore pinned diagnostic tools
        working-directory: .dotnet-performance-lab
        run: dotnet tool restore

      - name: Build performance harness
        working-directory: .dotnet-performance-lab
        run: dotnet build src/DotNetPerformanceLab/DotNetPerformanceLab.csproj --configuration Release --no-restore

      - name: Analyze application artifact
        id: analyze
        env:
          DPL_TARGET_PATH: ${{ runner.temp }}/dotnet-performance-target-${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.executable-path }}
          DPL_ALLOWED_ROOT: ${{ runner.temp }}/dotnet-performance-target-${{ github.run_id }}-${{ github.run_attempt }}
          DPL_ARGUMENTS_JSON: ${{ inputs.arguments-json }}
          DPL_WORKING_DIRECTORY: ${{ inputs.working-directory == '' && format('{0}/dotnet-performance-target-{1}-{2}', runner.temp, github.run_id, github.run_attempt) || format('{0}/dotnet-performance-target-{1}-{2}/{3}', runner.temp, github.run_id, github.run_attempt, inputs.working-directory) }}
          DPL_REPORT_LABEL: ${{ inputs.report-label }}
          DPL_INTERACTIVE_REPORT_URL: ${{ inputs.interactive-report-url }}
          DPL_OUTPUT_DIRECTORY: ${{ runner.temp }}/dotnet-performance-report-${{ github.run_id }}-${{ github.run_attempt }}
          DPL_TOOL_DIRECTORY: ${{ github.workspace }}/.dotnet-performance-lab
          DPL_WARMUP_SECONDS: ${{ inputs.warmup-seconds }}
          DPL_MEASUREMENT_SECONDS: ${{ inputs.measurement-seconds }}
          DPL_SAMPLE_INTERVAL_MS: ${{ inputs.sample-interval-ms }}
          DPL_COOLDOWN_SECONDS: ${{ inputs.cooldown-seconds }}
          DPL_ITERATIONS: ${{ inputs.iterations }}
          DPL_COLLECT_COUNTERS: ${{ inputs.collect-counters }}
          DPL_COUNTER_DURATION_SECONDS: ${{ inputs.counter-duration-seconds }}
          DPL_METERS_JSON: ${{ inputs.meters-json }}
          DPL_LIVE_ENDPOINT: ${{ inputs.live-endpoint }}
          DPL_LIVE_TOKEN: ${{ secrets.live-token }}
          DPL_LIVE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DPL_COLLECT_TRACE: ${{ inputs.collect-trace }}
          DPL_TRACE_DURATION_SECONDS: ${{ inputs.trace-duration-seconds }}
          DPL_FAIL_ON_TARGET_EXIT: ${{ inputs.fail-on-target-exit }}
        working-directory: .dotnet-performance-lab
        run: dotnet run --project src/DotNetPerformanceLab/DotNetPerformanceLab.csproj --configuration Release --no-build

      - name: Publish report to job summary
        if: ${{ always() && steps.analyze.outcome == 'success' }}
        env:
          DPL_REPORT_PATH: ${{ runner.temp }}/dotnet-performance-report-${{ github.run_id }}-${{ github.run_attempt }}/job-summary.md
        working-directory: .dotnet-performance-lab
        run: dotnet run --project src/DotNetPerformanceLab/DotNetPerformanceLab.csproj --configuration Release --no-build -- summary

      - name: Upload performance report
        if: ${{ always() && steps.analyze.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-performance-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dotnet-performance-report-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
