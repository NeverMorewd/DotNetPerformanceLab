name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Restore locked dependencies
        run: dotnet restore DotNetPerformanceLab.slnx --locked-mode

      - name: Build Release
        run: dotnet build DotNetPerformanceLab.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DotNetPerformanceLab.slnx --configuration Release --no-build
