name: End-to-end reusable workflow test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302
      - run: dotnet publish tests/DotNetPerformanceLab.TestTarget/DotNetPerformanceLab.TestTarget.csproj --configuration Release --runtime win-x64 --self-contained true --output '${{ runner.temp }}/target'
      - uses: actions/upload-artifact@v7
        with:
          name: performance-lab-self-test-target
          path: ${{ runner.temp }}/target
          retention-days: 1

  profile:
    needs: build
    uses: ./.github/workflows/profile-artifact.yml
    with:
      platform: Windows
      artifact-name: performance-lab-self-test-target
      executable-path: dpl-test-target.exe
      arguments-json: '["--lifetime-seconds","60"]'
      report-label: Performance Lab test target
      warmup-seconds: 1
      measurement-seconds: 5
      sample-interval-ms: 500
      cooldown-seconds: 0
      iterations: 1
      collect-counters: true
      counter-duration-seconds: 5
      collect-trace: true
      trace-duration-seconds: 5
      artifact-retention-days: 3
      toolkit-ref: ${{ github.ref_name }}
      use-github-hosted-validation-runner: true
