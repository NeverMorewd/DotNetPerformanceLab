name: Compare performance reports

on:
  workflow_call:
    inputs:
      reports-json:
        description: JSON array of 2-12 objects containing a unique label and HTTPS comparison-data.json URL.
        required: true
        type: string
      title:
        description: Comparison report title.
        required: false
        default: .NET Performance Comparison
        type: string
      interactive-report-url:
        description: Optional HTTPS Pages URL shown in the job summary.
        required: false
        default: ''
        type: string
      artifact-retention-days:
        required: false
        default: 30
        type: number
      toolkit-ref:
        required: false
        default: v2
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Compare reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout performance toolkit
        uses: actions/checkout@v7
        with:
          repository: NeverMorewd/DotNetPerformanceLab
          ref: ${{ inputs.toolkit-ref }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Restore locked dependencies
        run: dotnet restore DotNetPerformanceLab.slnx --locked-mode

      - name: Build comparison tool
        run: dotnet build src/DotNetPerformanceLab/DotNetPerformanceLab.csproj --configuration Release --no-restore

      - name: Compare performance reports
        env:
          DPL_COMPARISON_SOURCES_JSON: ${{ inputs.reports-json }}
          DPL_COMPARISON_TITLE: ${{ inputs.title }}
          DPL_COMPARISON_OUTPUT_DIRECTORY: ${{ runner.temp }}/dotnet-performance-comparison
          DPL_COMPARISON_REPORT_URL: ${{ inputs.interactive-report-url }}
        run: dotnet run --project src/DotNetPerformanceLab/DotNetPerformanceLab.csproj --configuration Release --no-build -- compare

      - name: Publish comparison to job summary
        env:
          DPL_REPORT_PATH: ${{ runner.temp }}/dotnet-performance-comparison/job-summary.md
        run: dotnet run --project src/DotNetPerformanceLab/DotNetPerformanceLab.csproj --configuration Release --no-build -- summary

      - name: Upload comparison report
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-performance-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dotnet-performance-comparison
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

