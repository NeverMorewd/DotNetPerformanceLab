name: Cross-repository probe

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      executable-path:
        required: true
        type: string
      allowed-root:
        required: true
        type: string
      arguments-json:
        required: false
        default: '[]'
        type: string
      working-directory:
        required: false
        default: ''
        type: string
      report-label:
        required: false
        default: External .NET application
        type: string
      warmup-seconds:
        required: false
        default: 60
        type: number
      measurement-seconds:
        required: false
        default: 300
        type: number
      sample-interval-ms:
        required: false
        default: 1000
        type: number
      cooldown-seconds:
        required: false
        default: 10
        type: number
      iterations:
        required: false
        default: 3
        type: number
      collect-counters:
        required: false
        default: true
        type: boolean
      counter-duration-seconds:
        required: false
        default: 30
        type: number
      collect-trace:
        required: false
        default: false
        type: boolean
      trace-duration-seconds:
        required: false
        default: 30
        type: number
      fail-on-target-exit:
        required: false
        default: true
        type: boolean
      artifact-retention-days:
        required: false
        default: 14
        type: number
      toolkit-ref:
        required: false
        default: fix/cross-repository-calls
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, metric-test, '${{ inputs.platform }}']
    environment: performance-lab
    timeout-minutes: 15
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7
        with:
          path: target
          persist-credentials: false

      - name: Checkout performance toolkit
        uses: actions/checkout@v7
        with:
          repository: NeverMorewd/DotNetPerformanceLab
          ref: ${{ inputs.toolkit-ref }}
          path: .dotnet-performance-lab
          persist-credentials: false

      - name: Set up diagnostic runtimes
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: |
            9.0.x
            10.0.302

      - name: Restore locked toolkit dependencies
        working-directory: .dotnet-performance-lab
        run: dotnet restore DotNetPerformanceLab.slnx --locked-mode

      - name: Restore pinned diagnostic tools
        working-directory: .dotnet-performance-lab
        run: dotnet tool restore

      - name: Build performance harness
        working-directory: .dotnet-performance-lab
        run: dotnet build src/DotNetPerformanceLab/DotNetPerformanceLab.csproj --configuration Release --no-restore
